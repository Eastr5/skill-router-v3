<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:512px;height:512px;background:#F7F6F3;font-family:"Microsoft YaHei",sans-serif}
.card{width:512px;height:512px;background:#F7F6F3;border:3px solid #E2E0DA;border-radius:28px;
 padding:52px 56px 48px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font-size:15px;letter-spacing:.24em;color:#8A8578}
.rule{width:56px;border:0;border-top:4px solid #1F7A52;margin:64px 0 30px}
h1{font-family:"Noto Serif SC","Source Han Serif SC",serif;font-weight:700;font-size:56px;
 line-height:1.16;color:#24292F;letter-spacing:.01em}
.layers{margin-top:34px;display:flex;flex-direction:column;gap:9px}
.b{height:11px;border-radius:6px}
.b1{width:216px;background:#2F5D8A}
.b2{width:158px;background:#1F7A52}
.b3{width:104px;background:#B5651D}
.foot{margin-top:auto;font-size:15px;letter-spacing:.22em;color:#8A8578}
.foot b{color:#1F7A52;font-weight:700}
</style></head><body><div class="card">
  <div class="top"><span>ROUTER</span><span>V3</span></div>
  <hr class="rule">
  <h1>Skill<br>Router</h1>
  <div class="layers"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
  <div class="foot"><b>MCP</b> · SKILL · TOOL</div>
</div></body></html>
