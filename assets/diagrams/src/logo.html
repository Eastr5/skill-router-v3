<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:680px;background:#F7F6F3;font-family:"Microsoft YaHei",sans-serif}
.card{width:1200px;height:680px;background:#F7F6F3;border:3px solid #E2E0DA;border-radius:30px;
 padding:56px 64px 52px;display:flex;gap:72px}
.left{flex:1.05;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font-size:17px;letter-spacing:.24em;color:#8A8578}
.rule{width:64px;border:0;border-top:5px solid #1F7A52;margin:46px 0 34px}
h1{font-family:"Noto Serif SC","Source Han Serif SC",serif;font-weight:700;font-size:88px;
 line-height:1.14;color:#24292F}
.foot{margin-top:auto;font-size:18px;letter-spacing:.24em;color:#8A8578}
.foot b{color:#1F7A52;font-weight:700}
.right{width:420px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.band{height:92px;border-radius:18px;display:flex;align-items:center;padding:0 34px;
 font-weight:700;font-size:28px;letter-spacing:.14em;color:#F7F6F3}
.band small{margin-left:auto;font-weight:400;font-size:15px;letter-spacing:.1em;opacity:.75}
.b1{background:#2F5D8A}.b2{background:#1F7A52}.b3{background:#B5651D}
</style></head><body><div class="card">
  <div class="left">
    <div class="top"><span>ROUTER</span><span>V3</span></div>
    <hr class="rule">
    <h1>Skill<br>Router</h1>
    <div class="foot"><b>MCP</b> · SKILL · TOOL</div>
  </div>
  <div class="right">
    <div class="band b1">MCP<small>外部服务</small></div>
    <div class="band b2">SKILL<small>领域知识</small></div>
    <div class="band b3">TOOL<small>IDE 原生操作</small></div>
  </div>
</div></body></html>
